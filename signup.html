<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Title & Meta -->

  <meta name="description" content="Create your CosmicPath account to unlock personalized horoscopes, zodiac insights, kundali details, and birth chart readings.">
  <meta name="author" content="CosmicPath">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png">

  <!-- Canonical (MATCHES GITHUB PAGES DOMAIN) -->
  <link rel="canonical" href="https://codewithsarina.github.io/cosmicpath/signup.html">

  <!-- Open Graph -->
  <meta property="og:site_name" content="CosmicPath">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Account – Signup for Astrology Dashboard">
  <meta property="og:description" content="Sign up for CosmicPath to access personalized horoscopes, zodiac insights, kundali details, and birth chart readings.">
  <meta property="og:url" content="https://codewithsarina.github.io/cosmicpath/signup.html">
  <meta property="og:image" content="https://codewithsarina.github.io/cosmicpath/preview.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Create Account – Signup for Astrology Dashboard">
  <meta name="twitter:description" content="Create your CosmicPath account and unlock personalized astrology insights.">
  <meta name="twitter:image" content="https://codewithsarina.github.io/cosmicpath/preview.jpg">

  <!-- Fonts & CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script defer src="script.js"></script>

  <!-- Structured Data (CORRECT TYPE FOR AUTH PAGE) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Create Account",
    "url": "https://codewithsarina.github.io/cosmicpath/signup.html",
    "description": "Signup page for CosmicPath astrology dashboard.",
    "publisher": {
      "@type": "Organization",
      "name": "CosmicPath",
      "url": "https://codewithsarina.github.io/cosmicpath/"
    }
  }
  </script>
</head>

<body class="cosmic">

  <!-- Header / Navbar -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">
        <div class="logo-mark" aria-hidden="true">✦</div>
        <div>
          <div class="brand">CosmicPath</div>
          <small class="tag">Discover Your Cosmic Path</small>
        </div>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-page container fade-in-up">

    <!-- SEO H1 -->
    <h1>Create Your CosmicPath Account</h1>

    <!-- Supporting SEO Text -->
    <p>
      Sign up to access your personal astrology dashboard, kundali details,
      zodiac insights, and AI-powered horoscope assistant.
    </p>

    <!-- Signup Card -->
    <div class="auth-card">
      <h2>Create Account</h2>

      <form id="signupForm" novalidate>
        <label for="name">Full Name</label>
        <input
          id="name"
          type="text"
          placeholder="Your full name"
          required
        >

        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >

        <label for="dob">Date of Birth</label>
        <input
          id="dob"
          type="date"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          minlength="6"
          placeholder="At least 6 characters"
          required
        >

        <div class="form-actions">
          <button type="submit" class="btn big">Sign Up</button>
        </div>

        <p id="signupError" class="error" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <h4>Contact</h4>
        <p>Email: <a href="mailto:hello@cosmicpath.example">hello@cosmicpath.example</a></p>
      </div>
      <div class="socials">
        <a href="https://twitter.com/cosmicpath" aria-label="Twitter">🐦</a>
        <a href="https://instagram.com/cosmicpath" aria-label="Instagram">📸</a>
      </div>
    </div>
    <div class="copyright">
      © <span id="year"></span> CosmicPath
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
