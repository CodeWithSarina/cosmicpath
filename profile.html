<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Astrology Profile | CosmicPath</title>
  <meta name="description" content="View your saved kundali profile, birth chart details, zodiac traits, and personalized horoscope dashboard.">
  <meta name="keywords" content="astrology profile, kundali, birth chart, horoscope, zodiac traits, CosmicPath">
  <meta name="author" content="CosmicPath">
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.png" type="image/png">

  <!-- Canonical -->
  <link rel="canonical" href="https://cosmicpath.com/profile.html">

  <!-- Open Graph -->
  <meta property="og:site_name" content="CosmicPath">
  <meta property="og:title" content="My Astrology Profile | CosmicPath">
  <meta property="og:description" content="Access your personalized astrology dashboard, view your kundali profile, birth chart, and zodiac insights.">
  <meta property="og:url" content="https://cosmicpath.com/profile.html">
  <meta property="og:image" content="https://cosmicpath.com/preview.jpg">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:title" content="My Astrology Profile | CosmicPath">
  <meta name="twitter:description" content="Access your personalized astrology dashboard, view your kundali profile, birth chart, and zodiac insights.">
  <meta name="twitter:image" content="https://cosmicpath.com/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts & CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script defer src="script.js"></script>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "CosmicPath",
    "url": "https://cosmicpath.com/",
    "logo": "https://cosmicpath.com/logo.png",
    "sameAs": [
      "https://facebook.com/yourpage",
      "https://instagram.com/yourpage",
      "https://twitter.com/yourpage"
    ]
  }
  </script>
</head>
<body class="cosmic">
  <!-- Navbar -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">
        <div class="logo-mark">✦</div>
        <div>
          <div class="brand">CosmicPath</div>
        </div>
      </a>
      <nav class="nav-links">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="chatbot.html">Chatbot</a>
        <button class="btn outline" id="logoutBtn">Logout</button>
      </nav>
    </div>
  </header>

  <!-- Profile Page -->
  <main class="container profile-page fade-in-up">
    <section class="profile-card">
      <div class="profile-left">
        <img id="profilePic" class="avatar" alt="Profile placeholder" src="" />
        <h2 id="profileName">—</h2>
        <p id="profileEmail">—</p>
        <p id="profileDOB">—</p>
        <button id="editProfileBtn" class="btn outline">Edit Profile</button>
        <button id="logoutBtn2" class="btn">Logout</button>
      </div>

      <div class="profile-right">
        <div class="info-block">
          <h3>Sun Sign</h3>
          <div id="sunSign" class="sun-sign">—</div>
        </div>

        <div class="info-block">
          <h3>Birth Chart</h3>
          <div class="chart-placeholder">
            <div class="chart-note">Birth chart visualization placeholder</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3>Edit Profile</h3>
      <form id="editForm">
        <label for="editName">Name</label>
        <input id="editName" required>
        <label for="editEmail">Email</label>
        <input id="editEmail" type="email" required>
        <label for="editDob">DOB</label>
        <input id="editDob" type="date" required>
        <div class="form-actions">
          <button type="submit" class="btn">Save</button>
          <button type="button" id="cancelEdit" class="btn outline">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <h4>Contact</h4>
        <p>hello@cosmicpath.example</p>
      </div>
      <div class="socials">
        <a aria-label="Twitter">🐦</a>
        <a aria-label="Instagram">📸</a>
      </div>
    </div>
    <div class="copyright">© <span id="year4"></span> CosmicPath</div>
  </footer>
</body>
</html>
